services:
  web:
    build:
      context: .
      dockerfile: ./compose/ui/Dockerfile
    depends_on:
      - app
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - public
  app:
    build:
      context: .
      dockerfile: ./compose/app/Dockerfile
    env_file:
      - "./.env"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - public
      - backend
    volumes:
      - ./images:/data/images
      - ./crew-seed.json:/data/seed/crew-seed.json
      - ./team-seed.json:/data/seed/team-seed.json
      - ./song-seed.json:/data/seed/song-seed.json
      - ./trainer-seed.json:/data/seed/trainer-seed.json
      - ./schedule-seed.json:/data/seed/schedule-seed.json
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: zero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zerotajnaapka
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zero"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  db_data:
networks:
  public:
  backend:
